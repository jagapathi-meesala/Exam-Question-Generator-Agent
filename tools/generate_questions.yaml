name: generate_exam_questions
purpose: Generate structured exam questions from supplied educational content and constraints.
input_schema:
  type: object
  required: [topic, question_type, count, difficulty]
  properties:
    topic: {type: string}
    source_text: {type: string}
    question_type: {type: string, enum: [mcq, short_answer, true_false, descriptive]}
    count: {type: integer, minimum: 1, maximum: 50}
    difficulty: {type: string, enum: [easy, medium, hard]}
    options_per_question: {type: integer, minimum: 2, maximum: 6}
output_schema:
  type: object
  required: [topic, count, questions]
